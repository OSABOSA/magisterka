apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-service
  namespace: magisterka
  labels:
    app: cpu-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-service
  template:
    metadata:
      labels:
        app: cpu-service
        tier: backend
    spec:
      containers:
        - name: cpu-service
          image: cpu-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
