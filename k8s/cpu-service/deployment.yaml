apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-service
  namespace: magisterka
  labels:
    app: cpu-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-service
  template:
    metadata:
      labels:
        app: cpu-service
        tier: backend
    spec:
      # --- Force scheduling on apps node pool ---
      nodeSelector:
        workload: apps
      containers:
        - name: cpu-service
          # --- GCP Artifact Registry image path (update PROJECT_ID) ---
          image: europe-west3-docker.pkg.dev/magisterka-497513/magisterka-repo/cpu-service:latest
          # Always pull to ensure latest image from GCP Artifact Registry
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10