apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: magisterka
  labels:
    app: prometheus-adapter
    tier: monitoring
data:
  config.yaml: |
    rules:
      - seriesQuery: 'cpu_service_http_requests_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "cpu_service_http_requests_total"
          as: "http_requests_per_second"
        metricsQuery: 'sum(rate(cpu_service_http_requests_total{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
      - seriesQuery: 'cpu_service_http_requests_inprogress{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "cpu_service_http_requests_inprogress"
          as: "http_requests_inflight"
        metricsQuery: 'sum(cpu_service_http_requests_inprogress{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
      - seriesQuery: 'io_service_http_requests_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "io_service_http_requests_total"
          as: "http_requests_per_second"
        metricsQuery: 'sum(rate(io_service_http_requests_total{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
      - seriesQuery: 'io_service_http_requests_inprogress{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "io_service_http_requests_inprogress"
          as: "http_requests_inflight"
        metricsQuery: 'sum(io_service_http_requests_inprogress{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
      - seriesQuery: '{__name__=~"^container_.*",namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^container_(.*)$"
          as: ""
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>,container!="POD",container!=""}) by (<<.GroupBy>>)'
