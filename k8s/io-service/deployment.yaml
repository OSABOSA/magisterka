apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-service
  namespace: magisterka
  labels:
    app: io-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: io-service
  template:
    metadata:
      labels:
        app: io-service
        tier: backend
    spec:
      # --- Force scheduling on apps node pool ---
      nodeSelector:
        workload: apps
      containers:
        - name: io-service
          # --- GCP Artifact Registry image path (update PROJECT_ID) ---
          image: europe-west3-docker.pkg.dev/magisterka-497513/magisterka-repo/io-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10