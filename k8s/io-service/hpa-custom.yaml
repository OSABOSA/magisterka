apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: io-service-hpa-custom
  namespace: magisterka
  labels:
    app: io-service
    hpa-strategy: custom-rps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: io-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
